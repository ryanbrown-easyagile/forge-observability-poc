app:
  id: ari:cloud:ecosystem::app/a4ee431d-357e-4cd9-b152-c9381e854c7e
  connect:
    key: com.easyagile.sprint.notes
    remote: connect
    authentication: jwt
  runtime:
    name: nodejs20.x
  storage:
    entities:
      - name: notes
        attributes:
          sprintId: 
            type: integer
          projectKey: 
            type: string
          title: 
            type: string
          content: 
            type: string
          author: 
            type: string
          dateCreated: 
            type: integer
          createdAt: 
            type: string
        indexes:
          - name: by-project-and-sprint
            partition: 
              - projectKey
              - sprintId
            range: 
              - projectKey 
          - name: by-id
            range: 
              - projectKey 
remotes:
  - key: connect
    baseUrl: https://rbrown-eanotes.au.ngrok.io/
  - key: notes-service
    baseUrl: https://rbrown-eanotes.au.ngrok.io/
    operations:
      - compute
      - storage
    storage:
      inScopeEUD: false
connectModules:
  jira:lifecycle:
    - key: lifecycle-events
      installed: /installed
      enabled: /enabled
modules:
  consumer:
    - key: notes-data-migration-consumer
      # Name of the queue for which this consumer will be invoked
      queue: notes-migration
      resolver:
        function: resolver
        method: migrate-note-data
  jira:boardAction:
    - key: easy-agile-sprint-notes-on-forge-entity-store
      resource: ui
      resolver:
        # endpoint: remote-note-service
        function: resolver
      viewportSize: large
      title: Sprint Notes (Entity Store)
  jira:adminPage:
    - key: sprint-notes-admin-page
      resource: admin
      title: Configure Sprint Notes
      render: native
      resolver:
        function: resolver
      useAsConfig: true
  endpoint:
    - key: remote-note-service
      remote: notes-service
  sql:
    - key: sql-storage
      engine: mysql
  scheduledTrigger:
    - key: db-schema-migrator
      function: migrator-function
      interval: hour 
  trigger:
    - key: post-install-schema-migration
      function: migrator-function
      events:
        - avi:forge:installed:app
        - avi:forge:updated:app
  function:
    - key: resolver
      handler: index.handler
    - key: migrator-function
      handler: index.doMigration
resources:
  - key: ui
    path: ../sprint-notes-forge-ui/dist
  - key: admin
    path: ./src/frontend/admin.tsx
permissions:
  scopes:
    - read:connect-jira
    - act-as-user:connect-jira
    - read:sprint:jira-software
    - read:user:jira
    - read:avatar:jira
    - read:application-role:jira
    - read:group:jira
    - storage:app	
  content:
    scripts:
      - 'unsafe-inline'
    styles:
      - 'unsafe-inline'

