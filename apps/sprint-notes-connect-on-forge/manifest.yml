app:
  id: ari:cloud:ecosystem::app/a4ee431d-357e-4cd9-b152-c9381e854c7e
  connect:
    key: com.easyagile.sprint.notes
    remote: connect
    authentication: jwt
  runtime:
    name: nodejs20.x
remotes:
  - key: connect
    baseUrl: https://rbrown-eanotes.au.ngrok.io/
  - key: notes-service
    baseUrl: https://rbrown-eanotes.au.ngrok.io/
    operations:
      - compute
      - storage
    storage:
      inScopeEUD: false
connectModules:
  jira:lifecycle:
    - key: lifecycle-events
      installed: /installed
      enabled: /enabled
modules:
  jira:boardAction:
    - key: easy-agile-sprint-notes-on-forge
      resource: main
      resolver:
        endpoint: remote-note-service
      viewportSize: large
      title: Sprint Notes (Forge - with Remotes)
  endpoint:
    - key: remote-note-service
      remote: notes-service
resources:
  - key: main
    path: ../sprint-notes-forge-ui/dist
permissions:
  scopes:
    - read:connect-jira
    - act-as-user:connect-jira
    - read:sprint:jira-software
    - read:user:jira
    - read:avatar:jira
    - read:application-role:jira
    - read:group:jira
  content:
    scripts:
      - 'unsafe-inline'
    styles:
      - 'unsafe-inline'
